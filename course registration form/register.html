<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <center>
        <h1><b><i>Registration Form</i></b></h1>
        <form>
            <table>
                <tr>
                    <td>Name:</td>
                    <td><input type="text" placeholder="Enter Your Name"></td>
                </tr>
                <tr>
                    <td>Age:</td>
                    <td><input type="number" placeholder="Enter Your Name"></td>
                </tr>
                <tr>
                   <td>Gender:</td>
                   <td>
                    <input type="radio" name="Gender">Male
                    <input type="radio" name="Gender">Female
                   </td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" placeholder="Enter Your Email"></td>
                </tr>
                <tr>
                    <td>Select a course:</td>
                    <td>
                        <select>
                            <option>Html</option>
                            <option>java</option>
                            <option>Javascript</option>
                            <option>Css</option>
                            <option>Python Programming</option>
                            <option>mongodp</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload Your Resume:</td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="reset">
                        <input type="submit">
                    </td>
                </tr>
            </table>
        </form>
        <a href="course.html">View Courses</a>
    </center>
</body>
</html>
